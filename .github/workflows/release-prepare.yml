name: Prepare release

# Ręczny krok 1/2 wydania stabilnego: podbija wersję na gałęzi release/vX.Y.Z i otwiera PR do main.
# Nic nie jest publikowane — to robi dopiero "Publish release" po zmergowaniu PR.
# Opis procesu: docs/RELEASING.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja wydania X.Y.Z (puste = obecna wersja dev bez przyrostka -dev)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version & open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # PAT (RELEASE_TOKEN) sprawia, że PR uruchamia ci.yml; bez niego PR powstaje, ale bez sprawdzeń.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

    steps:
      - name: Require the dev branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "dev" && "$REF_NAME" != "develop" ]]; then
            echo "::error::Uruchom workflow na gałęzi dev (wybrano: $REF_NAME)."
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and validate version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
            if [[ "$CURRENT" != *-dev ]]; then
              echo "::error::Cargo.toml ma wersję $CURRENT bez przyrostka -dev — podaj wersję ręcznie."
              exit 1
            fi
            VERSION="${CURRENT%-dev}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Niepoprawna wersja '$VERSION' (oczekiwano X.Y.Z)."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION już istnieje."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Gałąź release/v$VERSION już istnieje — zamknij stary PR i usuń gałąź."
            exit 1
          fi

          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
          if [[ -n "$LATEST" && "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]]; then
            echo "::error::Wersja $VERSION nie jest nowsza od ostatniego wydania v$LATEST."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Wydanie: v$VERSION (poprzednie: v${LATEST:-brak})"

      - name: Check release content (changelog, translations, README)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/check-release-content.sh "$VERSION"

      - name: Bump version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/bump-version.sh "$VERSION"

      - name: Commit, push and open the release PR
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          CODENAME=$(packaging/release-notes.sh "$VERSION" codename)
          BRANCH="release/v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): bump version to $VERSION ($CODENAME)"
          git push origin "$BRANCH"

          {
            echo "Wydanie **v$VERSION — „$CODENAME”**, przygotowane przez workflow *Prepare release*."
            echo
            echo "**Merge nic nie publikuje.** Po zmergowaniu uruchom ręcznie *Actions → Publish release* na \`main\`."
            echo
            echo "### Lista kontrolna"
            echo "- [ ] sprawdzenia CI na tym PR są zielone"
            echo "- [ ] treść wydania (CHANGELOG, tłumaczenia, plakietki README) jest poprawna"
            echo "- [ ] merge jako **merge commit** (nie squash), żeby \`dev\` mógł wrócić do \`main\` bez konfliktów"
            echo
            echo "### Notatki wydania"
            echo
            packaging/release-notes.sh "$VERSION" notes
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create --base main --head "$BRANCH" \
            --title "Release v$VERSION — $CODENAME" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "### Release PR utworzony (v$VERSION)"
            echo
            echo "1. Przejrzyj i zmerguj PR *Release v$VERSION* do \`main\` (merge commit)."
            echo "2. Uruchom *Actions → Publish release* na \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
