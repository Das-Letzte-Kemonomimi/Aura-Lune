name: Prepare release

# Manual step 1/2 of a stable release: bumps the version on a release/vX.Y.Z branch and opens a PR to main.
# Nothing is published here; "Publish release" does that after the PR is merged.
# Process: docs/RELEASING.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (empty = current dev version without the -dev suffix)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version & open release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A PAT (RELEASE_TOKEN) makes the PR trigger ci.yml; without it the PR is created but gets no checks.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}

    steps:
      - name: Require the dev branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "dev" && "$REF_NAME" != "develop" ]]; then
            echo "::error::Run the workflow on the dev branch (selected: $REF_NAME)."
            exit 1
          fi

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve and validate version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
            if [[ "$CURRENT" != *-dev ]]; then
              echo "::error::Cargo.toml has version $CURRENT without the -dev suffix: enter the version manually."
              exit 1
            fi
            VERSION="${CURRENT%-dev}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z)."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Branch release/v$VERSION already exists: close the old PR and delete the branch."
            exit 1
          fi

          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)
          if [[ -n "$LATEST" && "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]]; then
            echo "::error::Version $VERSION is not newer than the latest release v$LATEST."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release: v$VERSION (previous: v${LATEST:-none})"

      - name: Check release content (changelog, translations, README)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/check-release-content.sh "$VERSION"

      - name: Bump version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: packaging/bump-version.sh "$VERSION"

      - name: Commit, push and open the release PR
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          CODENAME=$(packaging/release-notes.sh "$VERSION" codename)
          BRANCH="release/v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): bump version to $VERSION ($CODENAME)"
          git push origin "$BRANCH"

          {
            echo "Release **v$VERSION — „$CODENAME”**, prepared by the *Prepare release* workflow."
            echo
            echo "**Merging publishes nothing.** After merging, run *Actions → Publish release* on \`main\` manually."
            echo
            echo "### Checklist"
            echo "- [ ] CI checks on this PR are green"
            echo "- [ ] release content (CHANGELOG, translations, README badges) is correct"
            echo "- [ ] merge as a **merge commit** (not squash), so \`dev\` can merge \`main\` back without conflicts"
            echo
            echo "### Release notes"
            echo
            packaging/release-notes.sh "$VERSION" notes
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create --base main --head "$BRANCH" \
            --title "Release v$VERSION — $CODENAME" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          {
            echo "### Release PR created (v$VERSION)"
            echo
            echo "1. Review and merge the *Release v$VERSION* PR into \`main\` (merge commit)."
            echo "2. Run *Actions → Publish release* on \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
