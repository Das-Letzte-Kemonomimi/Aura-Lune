name: Publish release

# Manual step 2/2 of a stable release. Runs on `main` after the "Prepare release" PR is merged.
# Builds the AppImage, runs the full CI on this SHA and publishes the GitHub release with SHA256SUMS.
# Merging into main publishes nothing. Process: docs/RELEASING.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build everything and leave the release as a draft (no publishing, no repo description change)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Own group name (not ${{ github.workflow }}), so it does not collide with the group of the called ci.yml.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      codename: ${{ steps.ver.outputs.codename }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::A release can only be published from the main branch (selected: $GITHUB_REF)."
            exit 1
          fi

      - name: Read and validate version
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' on main is not stable (X.Y.Z). Was the Prepare release PR merged?"
            exit 1
          fi
          if [[ "$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": "([^"]+)".*/\1/')" != "$VERSION" ]]; then
            echo "::error::tauri.conf.json has a different version than Cargo.toml."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists: this release has already been published."
            exit 1
          fi
          packaging/check-release-content.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "codename=$(packaging/release-notes.sh "$VERSION" codename)" >> "$GITHUB_OUTPUT"

  ci:
    name: Full CI on the release commit
    needs: verify
    uses: ./.github/workflows/ci.yml
    # ci.yml has a publish-dev-release job with `contents: write` (skipped when called,
    # but GitHub validates permissions before starting), so the caller must allow it.
    permissions:
      contents: write

  build-appimage:
    name: Build stable AppImage
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup build environment (toolchains, system libraries, frontend bundle)
        uses: ./.github/actions/setup-build-env

      - name: Build Tauri AppImage bundle
        env:
          # The channel and commit are embedded in the app (build.rs); GitHub sets GITHUB_SHA.
          AURALUNE_BUILD_CHANNEL: stable
        run: npm run tauri build -- --bundles appimage

      - name: Verify the AppImage name
        run: |
          set -euo pipefail
          EXPECTED="target/release/bundle/appimage/Auralune_${VERSION}_amd64.AppImage"
          if [[ ! -f "$EXPECTED" ]]; then
            echo "::error::Missing $EXPECTED (install.sh, PKGBUILD-bin and the updater expect exactly this name)."
            ls -la target/release/bundle/appimage/ || true
            exit 1
          fi
          ls -lh "$EXPECTED"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-stable
          path: target/release/bundle/appimage/Auralune_${{ needs.verify.outputs.version }}_amd64.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [verify, ci, build-appimage]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.ci.result == 'success' && needs.build-appimage.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment "release": optional approval gate (Settings → Environments → Required reviewers).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
      CODENAME: ${{ needs.verify.outputs.codename }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS and release notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.AppImage > SHA256SUMS && cat SHA256SUMS)
          packaging/release-notes.sh "$VERSION" notes > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"

      - name: Create the release as a draft with all assets
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          # A draft left by an earlier dry run would block creating the release, so delete it.
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "Deleting old draft $TAG..."
            gh release delete "$TAG" --yes
          fi

          # Everything in one call and as a draft: the updater never sees a release without SHA256SUMS.
          gh release create "$TAG" dist/*.AppImage dist/SHA256SUMS \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Auralune $VERSION — $CODENAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        run: gh release edit "v$VERSION" --draft=false --latest

      - name: Update repository description
        if: ${{ !inputs.dry_run }}
        env:
          # Changing the repository description needs admin rights, which GITHUB_TOKEN does not have.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::warning::RELEASE_TOKEN secret missing: skipped updating the repository description (About)."
            exit 0
          fi
          GH_TOKEN="$RELEASE_TOKEN" gh repo edit "$GITHUB_REPOSITORY" \
            --description "v${VERSION} | Native music player for Linux (Poweramp + foobar2000 + anime aesthetic + real-time DSP)"

      - name: Summary
        run: |
          {
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "### 🧪 Dry run — v$VERSION: the release was left as a DRAFT"
              echo "Check the files under *Releases*, then delete the draft or run the workflow again without dry run."
            else
              echo "### 🎉 Published v$VERSION — „$CODENAME”"
            fi
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "**Next steps (manual):**"
            echo "1. \`packaging/archlinux/update-aur-checksum.sh $VERSION\` → commit → \`packaging/archlinux/publish-to-aur.sh\`"
            echo "2. On \`dev\`: \`git merge origin/main\` and \`packaging/bump-version.sh <next>-dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
