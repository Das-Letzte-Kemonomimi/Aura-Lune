name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev", "develop" ]
  pull_request:
    branches: [ "main", "dev", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci

      - name: Lint frontend codebase (oxlint)
        run: npm --prefix apps/desktop run lint

      - name: Run unit & localization tests (vitest)
        run: npm --prefix apps/desktop test

      - name: Typecheck and build frontend (tsc -b && vite build)
        run: npm --prefix apps/desktop run build

  backend-desktop:
    name: Rust Backend & Desktop Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-backend-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-backend-
            ${{ runner.os }}-apt-

      - name: Install system dependencies (Linux GStreamer, Rubber Band, SoundTouch, WebKit)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            librubberband-dev \
            libsoundtouch-dev \
            pulseaudio \
            pulseaudio-utils \
            libasound2-plugins

      - name: Install frontend dependencies & build bundle
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run build

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Lint Rust codebase (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Setup headless audio daemon (PulseAudio + Null Sink)
        run: |
          pulseaudio -D --exit-idle-time=-1 || pulseaudio --start || true
          pactl load-module module-null-sink sink_name=DummyOutput || true

      - name: Run Rust workspace test suite (cargo test)
        env:
          GST_DEBUG: 2
        run: cargo test --workspace -- --test-threads=1

      - name: Run Desktop backend smoke test
        run: cargo test -p auralune-desktop --test desktop_smoke_test -- --nocapture

  publish-dev-release:
    name: Build & Publish Rolling Dev AppImage
    needs: [frontend, backend-desktop]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-publish-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-publish-
            ${{ runner.os }}-apt-

      - name: Install system dependencies (Linux GStreamer, WebKit, AppIndicator, FUSE)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            librubberband-dev \
            libsoundtouch-dev
          sudo apt-get install -y --no-install-recommends libfuse2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends libfuse2 || true

      - name: Install frontend dependencies & build bundle
        run: |
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run build

      - name: Build Tauri AppImage bundle
        run: |
          npm --prefix apps/desktop run tauri build -- --bundles appimage

      - name: Publish rolling dev release to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE_PATH=$(find target/release/bundle/appimage/ -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "❌ Error: AppImage bundle was not generated."
            exit 1
          fi
          echo "Found generated AppImage: $APPIMAGE_PATH"

          echo "Updating rolling 'dev-build' pre-release on GitHub..."
          gh release delete dev-build --yes --cleanup-tag || true

          gh release create dev-build \
            "$APPIMAGE_PATH" \
            --target "${{ github.sha }}" \
            --title "Auralune (Development Build)" \
            --notes "### 🌸 Auralune — Rolling Development Build

          Automated development build compiled from commit [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on branch \`dev\`.
          
          - **Tag**: \`dev-build\`
          - **Commit**: \`${{ github.sha }}\`
          - **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Channel**: \`dev\` (Installs side-by-side with stable Auralune as \`auralune-dev\`)
          
          #### Quick One-Liner Install:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/dev/install.sh | bash -s -- --dev
          \`\`\`" \
            --prerelease

