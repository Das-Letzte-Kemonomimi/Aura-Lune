name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev", "develop" ]
  pull_request:
    branches: [ "main", "dev", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux GStreamer, PipeWire, Rubber Band, SoundTouch, WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools \
            libpipewire-0.3-dev \
            libasound2-dev \
            libssl-dev \
            libsqlite3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librubberband-dev \
            libsoundtouch-dev \
            pkg-config \
            build-essential \
            pulseaudio

      - name: Install frontend dependencies
        run: |
          cd apps/desktop
          npm ci

      - name: Build frontend & verify TypeScript types (Vite + tsc)
        run: |
          cd apps/desktop
          npm run build

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --check

      - name: Lint Rust codebase (cargo clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run all Rust tests (cargo test)
        run: |
          pulseaudio -D --exit-idle-time=-1 || true
          cargo test --all-targets
