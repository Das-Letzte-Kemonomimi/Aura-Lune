name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev", "develop" ]
  pull_request:
    branches: [ "main", "dev", "develop" ]
  workflow_dispatch:
  # Wywoływany przez release-publish.yml: pełna bramka jakości na dokładnie tym SHA, który jest wydawany.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate shell scripts (bash -n)
        run: |
          find . -name '*.sh' -not -path '*/node_modules/*' -not -path './target/*' -print0 |
            xargs -0 -n1 bash -n

      - name: Lint frontend codebase (oxlint)
        run: npm run lint

      - name: Run unit & localization tests (vitest)
        run: npm test

      - name: Typecheck and build frontend (tsc -b && vite build)
        run: npm run build

  backend-desktop:
    name: Rust Backend & Desktop Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-backend-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-backend-
            ${{ runner.os }}-apt-

      - name: Install system dependencies (Linux GStreamer, Rubber Band, SoundTouch, WebKit)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            librubberband-dev \
            libsoundtouch-dev \
            pulseaudio \
            pulseaudio-utils \
            libasound2-plugins
          sudo rm -rf /var/cache/apt/archives/partial /var/cache/apt/archives/lock
          # Cache potrzebuje tylko odczytu pobranych pakietów.
          sudo chmod -R a+rX /var/cache/apt/archives

      - name: Install frontend dependencies & build bundle
        run: |
          npm ci
          npm run build

      - name: Check Rust formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Lint Rust codebase (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Setup headless audio daemon (PulseAudio + Null Sink)
        run: |
          pulseaudio -D --exit-idle-time=-1 || pulseaudio --start || true
          pactl load-module module-null-sink sink_name=DummyOutput || true

      - name: Run Rust workspace test suite (cargo test)
        env:
          GST_DEBUG: 2
        run: cargo test --workspace -- --test-threads=1

      # desktop_smoke_test jest częścią `cargo test --workspace` powyżej (bez drugiego uruchomienia).

      - name: Dependency audit (cargo-deny, report only)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          command: check advisories licenses bans

  publish-dev-release:
    name: Build & Publish Rolling Dev AppImage
    needs: [frontend, backend-desktop]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup build environment (toolchains, system libraries, frontend bundle)
        uses: ./.github/actions/setup-build-env

      - name: Build Tauri AppImage bundle
        env:
          # Wbudowuje kanał i commit (src-tauri/build.rs); GITHUB_SHA ustawia GitHub.
          AURALUNE_BUILD_CHANNEL: dev
        run: |
          npm run tauri build -- --bundles appimage

      - name: Publish rolling dev release to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE_PATH=$(find target/release/bundle/appimage/ -name "*.AppImage" -type f | head -n 1)
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "❌ Error: AppImage bundle was not generated."
            exit 1
          fi
          echo "Found generated AppImage: $APPIMAGE_PATH"

          # Pliki wydania: AppImage pod nazwą z Tauri oraz pod stałą nazwą (fallback install.sh),
          # a obok SHA256SUMS — aktualizator w aplikacji odmawia instalacji bez sumy kontrolnej.
          RELEASE_DIR="$(mktemp -d)"
          cp "$APPIMAGE_PATH" "$RELEASE_DIR/$(basename "$APPIMAGE_PATH")"
          cp "$APPIMAGE_PATH" "$RELEASE_DIR/Auralune-dev-x86_64.AppImage"
          (cd "$RELEASE_DIR" && sha256sum -- *.AppImage > SHA256SUMS && cat SHA256SUMS)

          echo "Updating rolling 'dev-build' pre-release on GitHub..."
          gh release delete dev-build --yes --cleanup-tag || true

          gh release create dev-build \
            "$RELEASE_DIR"/*.AppImage "$RELEASE_DIR/SHA256SUMS" \
            --target "${{ github.sha }}" \
            --title "Auralune (Development Build)" \
            --notes "### 🌸 Auralune — Rolling Development Build

          Automated development build compiled from commit [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) on branch \`dev\`.
          
          - **Tag**: \`dev-build\`
          - **Commit**: \`${{ github.sha }}\`
          - **Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Channel**: \`dev\` (Installs side-by-side with stable Auralune as \`auralune-dev\`)
          
          #### Quick One-Liner Install:
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/dev/install.sh | bash -s -- --dev
          \`\`\`" \
            --prerelease

