[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/dsp-api",
    "crates/audio-engine",
    "crates/cli-spike",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Kitsune Player Team"]
repository = "https://github.com/Auralune/Auralune"

[workspace.dependencies]
gstreamer = "0.25"
gstreamer-audio = "0.25"
gstreamer-app = "0.25"
glib = "0.22"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
