[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/dsp-api",
    "crates/audio-engine",
    "crates/cli-spike",
    "crates/storage",
    "crates/library",
    "crates/dsp-rubberband",
    "crates/dsp-soundtouch",
    "crates/desktop-integration",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Kitsune Player Team"]
repository = "https://github.com/Auralune/Auralune"

[workspace.dependencies]
gstreamer = "0.25"
gstreamer-audio = "0.25"
gstreamer-app = "0.25"
glib = "0.22"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
lofty = "0.25"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
