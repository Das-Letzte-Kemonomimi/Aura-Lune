[package]
name = "auralune-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "auralune_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
audio-engine = { path = "../../../crates/audio-engine" }
domain = { path = "../../../crates/domain" }
dsp-api = { path = "../../../crates/dsp-api" }
storage = { path = "../../../crates/storage" }
library = { path = "../../../crates/library" }
desktop-integration = { path = "../../../crates/desktop-integration" }
metadata = { path = "../../../crates/metadata" }
downloads = { path = "../../../crates/downloads" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
lofty.workspace = true
base64 = { workspace = true }
glib = { workspace = true }
walkdir = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }
