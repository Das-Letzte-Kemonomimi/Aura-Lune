<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/auralune_icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auralune — Kitsune Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: #090a12;
        color: #f8fafc;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      #auralune-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: radial-gradient(circle at 50% 42%, rgba(168, 85, 247, 0.14), transparent 55%), #090a12;
        user-select: none;
      }

      #auralune-boot-splash .boot-emblem {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 6.5rem;
        height: 6.5rem;
        border-radius: 9999px;
        background: rgba(18, 20, 36, 0.8);
        border: 1px solid rgba(168, 85, 247, 0.35);
        box-shadow: 0 0 36px rgba(168, 85, 247, 0.28);
      }

      #auralune-boot-splash .boot-emblem img {
        width: 4rem;
        height: 4rem;
      }

      #auralune-boot-splash .boot-title {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #f8fafc;
      }

      #auralune-boot-splash .boot-bar {
        width: 15rem;
        height: 0.25rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      #auralune-boot-splash .boot-bar-fill {
        width: 18%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #f43f5e, #a855f7, #06b6d4);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="auralune-boot-splash" role="status" aria-label="Loading Auralune">
        <div class="boot-emblem">
          <img src="/icon_lineout.svg" alt="" aria-hidden="true" />
        </div>
        <div class="boot-title">Auralune</div>
        <div class="boot-bar" aria-hidden="true">
          <div class="boot-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
